# Site built with the Minimal Mistakes theme: https://mmistakes.github.io/minimal-mistakes/
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"   # colours are overridden in assets/css/main.scss

locale: "en-US"
title: "Maurizio Pierini"
name: "Maurizio Pierini"
description: "Physicist at CERN on the CMS experiment."
url: "https://pierinim.github.io"
baseurl: ""
repository: "pierinim/pierinim.github.io"
search: true
breadcrumbs: false

author:
  name: "Maurizio Pierini"
  bio: "Physicist at CERN on CMS. AI Coordinator of the CERN research sector; CMS Physics Coordinator 2022–2024."
  location: "CERN, Geneva"
  links:
    - label: "INSPIRE-HEP"
      icon: "fas fa-fw fa-atom"
      url: "https://inspirehep.net/authors/1021028"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=3vZMAs4AAAAJ"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0003-1939-4268"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pierinim"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/maurizio-pierini-a04889a"

footer:
  links:
    - label: "INSPIRE-HEP"
      icon: "fas fa-fw fa-atom"
      url: "https://inspirehep.net/authors/1021028"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pierinim"

markdown: kramdown
kramdown:
  input: GFM

permalink: /:categories/:title/

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-redirect-from

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      share: false
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
