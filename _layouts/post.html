---
layout: default
---
<article class="panel prose">
  <a class="eyebrow" href="{{ site.baseurl }}/category/projects">← Projects{% if page.label %} · {{ page.label }}{% endif %}</a>
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  {{ content }}
  {% if page.tags.size > 0 %}
  <p class="chips">{% for t in page.tags %}<span class="chip">{{ t }}</span>{% endfor %}</p>
  {% endif %}
</article>
